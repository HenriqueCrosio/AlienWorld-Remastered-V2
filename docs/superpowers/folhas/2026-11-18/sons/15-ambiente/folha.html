e":"PixelLab (gerado)","licenca":"conta dele","nota":"\"still morning air over a smoldering wasteland, low hollow wind, slow lava and embers softly hissing and popping far away, melancholic, continuous, no birds, no music, no voices\""}]},{"nome":"amb.hangar","oque":"O HANGAR — o zumbido da baia, a tempestade abafada lá fora","onde":"a escolha da nave","lugar":"atmosfera","laco":true,"versoes":[{"id":"A","arquivo":"v/amb.hangar-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"large industrial spaceship hangar room tone, deep electrical hum and ventilation, a muffled storm heard through thick walls, continuous and even, no footsteps, no music, no voices\""},{"id":"B","arquivo":"v/amb.hangar-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"cavernous military aircraft hangar at night, low generators droning, air vents, faint metal ticking as the structure settles, rain and wind muffled outside, continuous, no music, no voices\""}]},{"nome":"amb.f1.fora","oque":"A F1 POR FORA — o vento sobre a colônia","onde":"a F1, fora da caverna","lugar":"atmosfera","laco":true,"versoes":[{"id":"A","arquivo":"v/amb.f1.fora-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"strong steady high altitude wind over a rocky alien moon surface, low rushing air with slow gusts, continuous and even, no thunder, no music, no voices\""},{"id":"B","arquivo":"v/amb.f1.fora-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"thin cold wind rushing past a fast aircraft low over a barren planet, airy turbulent whoosh with a deep low rumble underneath, continuous, no engine, no thunder, no music, no voices\""}]},{"nome":"amb.f1.caverna","oque":"A CAVERNA — o ar parado, as gotas e as brasas","onde":"a F1, dentro do salão","lugar":"caverna","laco":true,"versoes":[{"id":"A","arquivo":"v/amb.f1.caverna-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"deep cave ambience, still heavy air with a low rumble, sparse water drops echoing far away and faint embers crackling, continuous and even, no music, no voices\""},{"id":"B","arquivo":"v/amb.f1.caverna-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"vast underground cavern room tone, hollow low wind moving through tunnels, occasional faint single water drip with long echo, soft fire embers ticking, continuous, no music, no voices\""}]},{"nome":"amb.f2","oque":"O CINTURÃO — o ronco baixo da cabine","onde":"a F2 inteira","lugar":"cabine","laco":true,"versoes":[{"id":"A","arquivo":"v/amb.f2-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"inside a small spaceship cockpit drifting in deep space, very low soft hull rumble and faint air recycling, dark and quiet, continuous and even, no beeps, no music, no voices\""},{"id":"B","arquivo":"v/amb.f2-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"deep space ship interior drone, a dark sub bass hum felt through the hull with a very faint metallic resonance slowly shifting, lonely and empty, continuous, no beeps, no music, no voices\""}]},{"nome":"amb.f3.nebulosa","oque":"A NEBULOSA — o gás denso e a estática","onde":"a F3, Ato 1","lugar":"cabine","laco":true,"versoes":[{"id":"A","arquivo":"v/amb.f3.nebulosa-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"flying through a dense cosmic gas cloud heard from inside a ship, a slow breathing low drone with soft granular static washing over the hull, eerie, continuous and even, no music, no voices\""},{"id":"B","arquivo":"v/amb.f3.nebulosa-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"thick electrically charged fog in space, a dark swirling airy drone with faint crackling radio static and slow pressure swells, unsettling, continuous, no sharp zaps, no music, no voices\""}]},{"nome":"amb.f3.casco","oque":"O CASCO — o metal sob tensão e o canto do Leviatã ao longe","onde":"a F3, Ato 2","lugar":"cabine","laco":true,"versoes":[{"id":"A","arquivo":"v/am  no music, no voices\""}]}]},{"titulo":"O menu da noite","sons":[{"nome":"fx.menu.trovao.perto","oque":"O TROVÃO PERTO — quando o relâmpago cai com raio","onde":"o menu da noite","lugar":"atmosfera","versoes":[{"id":"A","arquivo":"v/fx.menu.trovao.perto-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a close violent thunder crack followed by a deep rolling rumble fading away, night storm, no rain, no music\""},{"id":"B","arquivo":"v/fx.menu.trovao.perto-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"lightning striking nearby, a sharp tearing snap then a huge booming thunderclap with a long decaying roll across the sky, no rain, no music\""}]},{"nome":"fx.menu.trovao.longe","oque":"O TROVÃO LONGE — quando é só o clarão nas nuvens","onde":"o menu da noite","lugar":"atmosfera","versoes":[{"id":"A","arquivo":"v/fx.menu.trovao.longe-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"distant soft thunder, a long low rumble rolling far behind the clouds, no sharp crack, no rain, no music\""},{"id":"B","arquivo":"v/fx.menu.trovao.longe-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"thunder rumbling far beyond the horizon, a muffled slow growl swelling and dying away inside heavy clouds, no crack, no rain, no music\""}]}]},{"titulo":"A F1: a invasão no horizonte e a caverna","sons":[{"nome":"fx.f1.flyby","oque":"AS NAVES INVASORAS — cada uma das 5 descendo das nuvens (os seus flybys)","onde":"a F1, ao fundo","lugar":"atmosfera","plano":"fundo","versoes":[{"id":"D1","arquivo":"v/fx.f1.flyby-D1.ogg","fonte":"feito por ele","licenca":"dele","nota":"\"o flyby dele (falcon style), uma nave invasora descendo das nuvens\""},{"id":"D2","arquivo":"v/fx.f1.flyby-D2.ogg","fonte":"feito por ele","licenca":"dele","nota":"\"o flyby dele (variação), uma nave invasora descendo das nuvens\""},{"id":"D3","arquivo":"v/fx.f1.flyby-D3.ogg","fonte":"feito por ele","licenca":"dele","nota":"\"o flyby dele (jato ao longe,
