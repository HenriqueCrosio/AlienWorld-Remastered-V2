<script type="application/json" id="dados">{"titulo":"Folha de sons 3 — os inimigos comuns e os perigos","dia":"2026-11-16","nota":"A morte de cada um já é a explosão do material (folha 2); aqui ficam o TIRO, o AVISO e os momentos próprios.\nO tiro inimigo é o som que mais repete no jogo (filas, ondas): julgue no ×8, e ele deve avisar sem assustar. O aviso (o telegrafar) é para o jogador LER: tem a duração exata do piscar do jogo.\nAs versões C sintetizadas (avisos, pavio, gás) têm o tempo do jogo medido no código.\n\"Ouvir no lugar\": cada som abre onde mais toca — atmosfera (F1), cabine/espaço (F2 e F3), interior (F4). O impacto da rocha é no vácuo: só o que passa pelo casco.\nEscolha uma versão por som (ou \"refazer\" + nota) e cole o texto do rodapé na conversa.","grupos":[{"titulo":"Os inimigos comuns","sons":[{"nome":"inimigo.tiro","oque":"O TIRO mirado (o mais repetido da folha: macio, baixo)","onde":"a canhoneira, F1–F4","lugar":"cabine","repetir":true,"variacao":{"tom":0.05,"vol":0.1},"versoes":[{"id":"A","arquivo":"v/inimigo.tiro-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a soft muted energy pulse shot fired by a small alien gunship, a short low plasma blip, round and dull, warm low-mid tone, no high hiss, no crackle, dark sci-fi, dry, no music\""},{"id":"B","arquivo":"v/inimigo.tiro-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a quiet low thud of an alien plasma bolt being fired, soft attack, very short, deep and rounded like a muffled pop, no treble, dark sci-fi, dry, no music\""},{"id":"C","arquivo":"v/inimigo.tiro-C.ogg","fonte":"Kenney · laserSmall_004.ogg","licenca":"CC0","nota":""}]},{"nome":"inimigo.aviso","oque":"O AVISO — os 0,45 s em que a canhoneira pisca antes de atirar","onde":"a canhoneira, F1–F4","lugar":"cabine","repetir":true,"variacao":{"tom":0.03,"vol":0.08},"versoes":[{"id":"A","arquivo":"v/inimigo.aviso-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a short rising energy charge-up whine of an alien gunship cannon charging right before it fires, soft and clear, the pitch rising for half a second then stopping, dark sci-fi, dry, no music\""},{"id":"B2","arquivo":"v/inimigo.aviso-B2.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a soft electronic charging tone of an alien cannon powering up, a smooth low hum sliding upward in pitch for half a second, clear and gentle, a warning, dark sci-fi, dry, no music\""},{"id":"C","arquivo":"v/inimigo.aviso-C.ogg","fonte":"sintetizado aqui (sem ruído)","licenca":"próprio","nota":"\"sintetizado: 0,45 s (o telégrafo da canhoneira), um tom subindo 180 → 520 Hz com um tremor leve\""}]},{"nome":"aranha.tiro","oque":"O LEQUE de 3 (os três tocam como um só, mais pesado)","onde":"a aranha do casco, F3","lugar":"cabine","repetir":true,"variacao":{"tom":0.04,"vol":0.08},"versoes":[{"id":"A","arquivo":"v/aranha.tiro-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a heavy biomechanical spider machine spitting three copper projectiles at once, a dense heavy launch thump with a metallic edge, short, dark sci-fi, dry, no music\""},{"id":"B","arquivo":"v/aranha.tiro-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a chunky triple shot of a heavy alien cannon, three dull thumps overlapping very close together, low and weighty, short, dark sci-fi, dry, no music\""},{"id":"C","arquivo":"v/aranha.tiro-C.ogg","fonte":"Kenney · laserLarge_003.ogg","licenca":"CC0","nota":""}]},{"nome":"aranha.aviso","oque":"O AGACHAR — os 0,5 s piscando antes do salto","onde":"a aranha do casco, F3","lugar":"cabine","versoes":[{"id":"A","arquivo":"v/aranha.aviso-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a large metal mechanical spider crouching down to jump, a hydraulic hiss and leg servos compressing under load, a low warning creak, short, dark sci-fi, no music\""},{"id":"B","arquivo":"v/aranha.aviso-B.ogg","fonte":"PixelLab (gerado)","licenca":"co
