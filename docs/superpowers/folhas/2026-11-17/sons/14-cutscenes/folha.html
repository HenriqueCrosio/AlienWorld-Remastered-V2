<script type="application/json" id="dados">{"titulo":"Folha de sons 7 — as cutscenes (+ a saída da atmosfera)","dia":"2026-11-17","nota":"O que as cenas ainda não têm: as explosões delas JÁ soam (a folha 2, pelo material), o bum oco da Aurora e o estrondo do hangar também. Aqui ficam os momentos mecânicos e da história: o piloto automático, o pouso, a decolagem, os alarmes, os cabos, a queda no Leviatã, a boca que sela — e a cutscene FINAL inteira, que hoje é muda.\nOS SEUS FLYBYS (D1 falcon, D2 variação, D3 jato ao longe) entram como versões em dois lugares: a SAÍDA DA ATMOSFERA (o fim da F1, a subida a 45° depois da Torre) e o SOBREVOO da cutscene final. Na saída, a M mistura o seu falcon com o vento rarefazendo.\nSem gerar nada, no jogo: o torpedo do Leviatã usa o lançar do míssil da nave, e o voo das cutscenes ganha o motor da própria nave, baixo. E a subida da F1 passa a ABRIR a acústica para o espaço (o lugar troca de atmosfera para cabine durante ela).","grupos":[{"titulo":"A saída da atmosfera (o fim da F1)","sons":[{"nome":"momento.f1.saida","oque":"A SUBIDA — \"ATMOSFERA ROMPIDA · ZERO-G\", a nave sobe a 45° por 6,5 s e o ar acaba","onde":"o fim da F1","lugar":"atmosfera","versoes":[{"id":"A","arquivo":"v/momento.f1.saida-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a spaceship climbing out of a planet's atmosphere, a roaring wind rush thinning out into the silence of space, no music\""},{"id":"M","arquivo":"v/momento.f1.saida-M.ogg","fonte":"sintetizado aqui (sem ruído)","licenca":"próprio","nota":"\"o flyby dele + o vento rarefazendo\""},{"id":"D1","arquivo":"v/momento.f1.saida-D1.ogg","fonte":"sintetizado aqui (sem ruído)","licenca":"próprio","nota":"\"o flyby dele (falcon style), na subida a 45° que rompe a atmosfera\""},{"id":"D2","arquivo":"v/momento.f1.saida-D2.ogg","fonte":"sintetizado aqui (sem ruído)","licenca":"próprio","nota":"\"o flyby dele (variação), na subida a 45° que rompe a atmosfera\""},{"id":"D3","arquivo":"v/momento.f1.saida-D3.ogg","fonte":"sintetizado aqui (sem ruído)","licenca":"próprio","nota":"\"o flyby dele (jato ao longe, 8 s), na subida a 45° que rompe a atmosfera\""}]}]},{"titulo":"Os momentos que se repetem nas cutscenes 1 e 2","sons":[{"nome":"cut.piloto","oque":"PILOTO AUTOMÁTICO · ENGATADO — o computador assume o manche","onde":"a Aurora e a Doca","lugar":"cabine","versoes":[{"id":"A","arquivo":"v/cut.piloto-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a starship cockpit autopilot engaging, a short servo whir and a confirming electronic chirp, dark sci-fi, no music\""},{"id":"B","arquivo":"v/cut.piloto-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a flight computer taking control, a soft mechanical clunk followed by a rising hum, cockpit, no music\""}]},{"nome":"cut.pouso.descida","oque":"A DESCIDA — os retros freando até o convés (2 s)","onde":"a Aurora e a Doca","lugar":"cabine","versoes":[{"id":"A","arquivo":"v/cut.pouso.descida-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a small spaceship descending onto a landing deck, retro thrusters braking in pulses with a muffled hiss, heard from the cockpit, no music\""},{"id":"B","arquivo":"v/cut.pouso.descida-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"landing thrusters firing in short bursts, a low steady roar slowing down, sci-fi, no music\""}]},{"nome":"cut.pouso.toque","oque":"O TOQUE — as travas pegando no convés","onde":"a Aurora e a Doca","lugar":"cabine","versoes":[{"id":"A","arquivo":"v/cut.pouso.toque-A.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"a spaceship touching down on a metal deck, magnetic landing clamps locking with a heavy clunk, no music\""},{"id":"B","arquivo":"v/cut.pouso.toque-B.ogg","fonte":"PixelLab (gerado)","licenca":"conta dele","nota":"\"landing gear meeting steel, a deep thud and a hydraulic hiss as it settles, no music\""}]},{"nome":"cut.decolagem","oque":"A PARTIDA — a
